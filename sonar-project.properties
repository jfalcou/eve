# SonarQube Cloud - https://sonarcloud.io
sonar.organization=jfalcou
sonar.projectKey=jfalcou_eve
sonar.projectName=EVE
 
# The library is header-only: its headers are only analyzed as seen from the translation units that
# include them, the tests. The C++ analyzer ignores everything under sonar.tests, so test/ has to be
# a source directory; the rules below keep the report about include/eve.
sonar.sources=include,test
sonar.sourceEncoding=UTF-8
 
# Only the C++ analyzer: EVE has no C sources and its .h files are C++.
sonar.cpp.file.suffixes=.hpp,.h,.cpp
sonar.c.file.suffixes=-
 
# Benchmarks, examples and the build tree are not analyzed.
sonar.exclusions=benchmarks/**,examples/**,doc/**,test/doc/**,test/exhaustive/**,test/integration/**,test/random/**,test/tmp_boost/**,test/tts/**,build/**
 
# No issue, no duplication and no coverage measure on the tests themselves.
sonar.issue.ignore.multicriteria=tests
sonar.issue.ignore.multicriteria.tests.ruleKey=*
sonar.issue.ignore.multicriteria.tests.resourceKey=test/**
sonar.cpd.exclusions=test/**
sonar.coverage.exclusions=test/**