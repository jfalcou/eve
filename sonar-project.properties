# SonarQube Cloud - https://sonarcloud.io
# Keys: organization from Administration > Organization settings, project from Project Information.
sonar.organization=jfalcou
sonar.projectKey=jfalcou_eve
sonar.projectName=EVE
 
# The library is the subject; the tests are the translation units that let the analyzer see it.
sonar.sources=include
sonar.tests=test
sonar.sourceEncoding=UTF-8
 
# Only the C++ analyzer: EVE has no C sources and its .h files are C++.
sonar.cpp.file.suffixes=.hpp,.h,.cpp
sonar.c.file.suffixes=-
 
# Benchmarks, examples and the build tree are not analyzed.
sonar.exclusions=benchmarks/**,examples/**,build/**