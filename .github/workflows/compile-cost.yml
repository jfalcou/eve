####################################################################################################
name: EVE - Compile Cost
run-name: compile-cost

####################################################################################################
## Both measurements run on the machine we control, inside the pinned image the rest of the CI
## uses. The image is what makes the numbers comparable: a peak belongs to the compiler that
## produced it as much as to the code, and the machine's own clang moves with its packages. A
## reference measured on main weeks earlier would otherwise be read against a different compiler,
## and the delta would be reporting an upgrade.
##
## The pull request measurement waits for the unit tests to be done rather than competing with them
## for the runner, hence workflow_run instead of pull_request. The exception is a pull request that
## touches the measurement itself: workflow_run only ever dispatches the copy of this file sitting
## on the default branch, so such a change would otherwise reach main having never run once.
####################################################################################################
on:
  workflow_run:
    workflows: ["EVE - Unit Tests"]
    types:
      - completed
  pull_request:
    paths:
      - '.github/workflows/compile-cost.yml'
      - 'cmake/config/proc-stat.cmake'
      - 'tools/compile_cost.py'
  push:
    branches:
      - main

####################################################################################################
## One measurement at a time on the runner. Two at once still produce numbers, and nothing in them
## says they are wrong.
####################################################################################################
concurrency:
  group: compile-cost
  cancel-in-progress: false

jobs:
  ##################################################################################################
  ## A PULL REQUEST, once its unit tests are through.
  ##
  ## The baseline is the artifact the reference job left on the last push to main. Downloading it
  ## rather than rebuilding halves the work, and costs nothing in accuracy now that both sides come
  ## from the same runner and the same image.
  ##################################################################################################
  pull-request:
    if: github.event_name != 'push'
    runs-on: [self-hosted, generic-x86]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    ## Reading the reference off another run asks for more than the contents scope the token defaults to.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch the commit the unit tests ran on
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      ##########################################################################################
      ## The parallelism comes from the memory left on the runner, not from its core count. One
      ## clang on the heaviest unit of the suite peaks near 3 GiB, and the runner is shared with
      ## the unit tests of every other branch: a fixed -j 16 exhausted 64 GiB and the OOM killer
      ## took a job from an unrelated pull request down with it. Eight GiB stay reserved for the
      ## rest of the machine and the ceiling stays low, so only the wall clock pays. The figures
      ## themselves are per process and do not move with -j.
      ##########################################################################################
      - name: Measure
        run: |
          available=$(awk '/MemAvailable/ { print int($2 / 1048576) }' /proc/meminfo)
          jobs=$(( (available - 8) / 4 ))
          if [ "$jobs" -lt 2 ]; then jobs=2; fi
          if [ "$jobs" -gt 6 ]; then jobs=6; fi
          echo "Measuring with -j $jobs, out of $available GiB available"
          cmake -S . -B build -G Ninja -DEVE_PROC_STAT=ON -DEVE_BUILD_DOCUMENTATION=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DEVE_USE_PCH=0
          cmake --build build -j "$jobs" --target unit.exe

      ##########################################################################################
      ## The reference lives in the last successful run of this workflow on main, not in the run
      ## that triggered this one, so it has to be looked up rather than named. Both steps are
      ## JavaScript actions, which the runner provides its own node for, so they work inside the
      ## container where the image's own tooling might not.
      ##########################################################################################
      - name: Find the reference run
        id: reference
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'compile-cost.yml',
              branch: 'main',
              status: 'success',
              per_page: 1
            });
            return runs.data.workflow_runs.length ? String(runs.data.workflow_runs[0].id) : '';

      - name: Fetch the reference measured on main
        if: steps.reference.outputs.result != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: compile-cost-reference
          path: reference
          run-id: ${{ steps.reference.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        run: |
          if [ -f reference/compile-cost.csv ]; then
            baseline="--baseline reference/compile-cost.csv"
          else
            baseline=""
            echo "> No reference from main was found, so this run has no delta." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/compile_cost.py build/compile-cost.csv $baseline \
                  --full compile-cost-full.md                           \
                  --title "Compile cost"                                \
                  >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cost
          path: |
            compile-cost-full.md
            build/compile-cost.csv
          if-no-files-found: warn
          retention-days: 14

  ##################################################################################################
  ## MAIN - the reference every pull request is read against, kept long enough to see a trend.
  ##################################################################################################
  reference:
    if: github.event_name == 'push'
    runs-on: [self-hosted, generic-x86]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch main
        uses: actions/checkout@v6

      ##########################################################################################
      ## The parallelism comes from the memory left on the runner, not from its core count. One
      ## clang on the heaviest unit of the suite peaks near 3 GiB, and the runner is shared with
      ## the unit tests of every other branch: a fixed -j 16 exhausted 64 GiB and the OOM killer
      ## took a job from an unrelated pull request down with it. Eight GiB stay reserved for the
      ## rest of the machine and the ceiling stays low, so only the wall clock pays. The figures
      ## themselves are per process and do not move with -j.
      ##########################################################################################
      - name: Measure
        run: |
          available=$(awk '/MemAvailable/ { print int($2 / 1048576) }' /proc/meminfo)
          jobs=$(( (available - 8) / 4 ))
          if [ "$jobs" -lt 2 ]; then jobs=2; fi
          if [ "$jobs" -gt 6 ]; then jobs=6; fi
          echo "Measuring with -j $jobs, out of $available GiB available"
          cmake -S . -B build -G Ninja -DEVE_PROC_STAT=ON -DEVE_BUILD_DOCUMENTATION=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DEVE_USE_PCH=0
          cmake --build build -j "$jobs" --target unit.exe

      - name: Report
        run: |
          python3 tools/compile_cost.py build/compile-cost.csv \
                  --full compile-cost-full.md                  \
                  --title "Compile cost of main"               \
                  >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cost-reference
          path: |
            compile-cost-full.md
            build/compile-cost.csv
          if-no-files-found: warn
          retention-days: 90
