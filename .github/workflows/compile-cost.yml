####################################################################################################
name: EVE - Compile Cost
run-name: compile-cost

####################################################################################################
## The reference every pull request is read against. The pull request side of the measurement lives
## in the unit test workflow instead, at the head of the chain that runs on this same host, because
## only a `needs` inside one workflow can keep the two off the machine at the same time.
##
## Both sides run inside the pinned image, and that is what makes the numbers comparable: a peak
## belongs to the compiler that produced it as much as to the code, and the machine's own clang
## moves with its packages. A reference measured weeks earlier would otherwise be read against a
## different compiler, and the delta would be describing the upgrade.
####################################################################################################
on:
  push:
    branches:
      - main

####################################################################################################
## Shared with the pull request measurement in the unit test workflow: one at a time on the host.
####################################################################################################
concurrency:
  group: compile-cost
  cancel-in-progress: false

jobs:
  reference:
    runs-on: [self-hosted, generic-x86]
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root

    steps:
      - name: Fetch main
        uses: actions/checkout@v6

      - name: Measure
        run: |
          cmake -S . -B build -G Ninja -DEVE_PROC_STAT=ON -DEVE_BUILD_DOCUMENTATION=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DEVE_USE_PCH=0
          cmake --build build -j 16 --target unit.exe

      - name: Report
        run: |
          python3 tools/compile_cost.py build/compile-cost.csv \
                  --full compile-cost-full.md                  \
                  --title "Compile cost of main"               \
                  >> "$GITHUB_STEP_SUMMARY"

      ##############################################################################################
      ## Kept long enough to see a trend, and named so the pull request side can find it.
      ##############################################################################################
      - name: Upload the reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cost-reference
          path: |
            compile-cost-full.md
            build/compile-cost.csv
          if-no-files-found: warn
          retention-days: 90
