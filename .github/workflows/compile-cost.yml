####################################################################################################
name: EVE - Compile Cost
run-name: compile-cost

####################################################################################################
## Both measurements run on the machine we control, at -j 16. Same hardware and therefore same
## clang on either side is what makes a peak comparable at all: the figure belongs to the compiler
## that produced it as much as to the code.
##
## The pull request measurement waits for the unit tests to be done rather than competing with them
## for the runner, hence workflow_run instead of pull_request.
####################################################################################################
on:
  workflow_run:
    workflows: ["EVE - Unit Tests"]
    types:
      - completed
  push:
    branches:
      - main

####################################################################################################
## One measurement at a time on the runner. Two at once still produce numbers, and nothing in them
## says they are wrong.
####################################################################################################
concurrency:
  group: compile-cost
  cancel-in-progress: false

jobs:
  ##################################################################################################
  ## A PULL REQUEST, once its unit tests are through.
  ##
  ## The baseline is the artifact the reference job left on the last push to main. Downloading it
  ## rather than rebuilding halves the work, and costs nothing in accuracy now that both sides come
  ## from the same runner and the same image.
  ##################################################################################################
  pull-request:
    if: github.event_name == 'workflow_run'
    runs-on: [self-hosted, generic-x86]
    steps:
      - name: Fetch the commit the unit tests ran on
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Measure
        run: |
          cmake -S . -B build -G Ninja -DEVE_PROC_STAT=ON -DEVE_BUILD_DOCUMENTATION=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DEVE_USE_PCH=0
          cmake --build build -j 16 --target unit.exe

      ##########################################################################################
      ## The reference lives in the last successful run of this workflow on main, not in the run
      ## that triggered this one, so it has to be looked up rather than named.
      ##########################################################################################
      - name: Fetch the reference measured on main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "EVE - Compile Cost" \
                            --branch main --status success --limit 1                    \
                            --json databaseId -q '.[0].databaseId')
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                            --name compile-cost-reference --dir reference
          fi

      - name: Report
        run: |
          if [ -f reference/compile-cost.csv ]; then
            baseline="--baseline reference/compile-cost.csv"
          else
            baseline=""
            echo "> No reference from main was found, so this run has no delta." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/compile_cost.py build/compile-cost.csv $baseline \
                  --full compile-cost-full.md                           \
                  --title "Compile cost"                                \
                  >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cost
          path: |
            compile-cost-full.md
            build/compile-cost.csv
          if-no-files-found: warn
          retention-days: 14

  ##################################################################################################
  ## MAIN - the reference every pull request is read against, kept long enough to see a trend.
  ##################################################################################################
  reference:
    if: github.event_name == 'push'
    runs-on: [self-hosted, generic-x86]
    steps:
      - name: Fetch main
        uses: actions/checkout@v6

      - name: Measure
        run: |
          cmake -S . -B build -G Ninja -DEVE_PROC_STAT=ON -DEVE_BUILD_DOCUMENTATION=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DEVE_USE_PCH=0
          cmake --build build -j 16 --target unit.exe

      - name: Report
        run: |
          python3 tools/compile_cost.py build/compile-cost.csv \
                  --full compile-cost-full.md                  \
                  --title "Compile cost of main"               \
                  >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cost-reference
          path: |
            compile-cost-full.md
            build/compile-cost.csv
          if-no-files-found: warn
          retention-days: 90
