name: EVE - Unit Tests Build Modes
on:
  pull_request:
    branches:
      - main

concurrency:
  group: unit-modes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Special non-arch-specific tests
  ##################################################################################################
  special:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: clang, arch: x86    , opts: "-march=native -O3 -DEVE_SPECIAL_TESTS" }
        - { comp: gcc  , arch: x86    , opts: "-march=native -O3 -DEVE_SPECIAL_TESTS" }
    steps:
      - name: Print Runner Info
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
          echo "Available disk space: $(df -h / | tail -1 | awk '{print $4 "/" $2}')"
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Prepare EVE with ${{ matrix.cfg.comp }} @ ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run:  |
          mkdir build
          cd build
          cmake ..  -G Ninja -DEVE_TEST_LOT=family -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DEVE_USE_PCH=0 \
                    -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake
      - name: Compile Unit Tests
        run:  |
          cd build
          ninja -j 4 unit.internals.float16.exe
      - name: Running Unit Tests
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R unit.internals.float16.exe

  ##################################################################################################
  ## Check no PCH mode
  ##################################################################################################
  no_pch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: clang, arch: x86    , opts: "-msse2" }
        - { comp: gcc  , arch: x86    , opts: "-msse2" }
    steps:
      - name: Print Runner Info
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
          echo "Available disk space: $(df -h / | tail -1 | awk '{print $4 "/" $2}')"
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Prepare EVE with ${{ matrix.cfg.comp }} @ ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run:  |
          mkdir build
          cd build
          cmake ..  -G Ninja -DEVE_TEST_LOT=native -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DEVE_USE_PCH=0 \
                    -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake
      - name: "Chunk 1: Compile"
        run:  |
          cd build
          ninja unit.core.exe -j 4
      - name: "Chunk 1: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.core\."
      - name: "Chunk 1: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 2: Compile"
        run:  |
          cd build
          ninja unit.api.exe unit.math.exe -j 4
      - name: "Chunk 2: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.api\.|^unit\.math\."
      - name: "Chunk 2: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 3: Compile"
        run:  |
          cd build
          ninja unit.arch.exe unit.meta.exe unit.internals.exe unit.polynomial.exe unit.combinatorial.exe unit.bessel.exe unit.elliptic.exe unit.memory.exe unit.special.exe unit.algo.exe examples.exe -j 4
      - name: "Chunk 3: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.arch\.|^unit\.meta\.|^unit\.internals\.|^unit\.polynomial\.|^unit\.combinatorial\.|^unit\.bessel\.|^unit\.elliptic\.|^unit\.memory\.|^unit\.special\.|^unit\.algo\.|^examples\."

  ##################################################################################################
  ## Check External dependencies
  ##################################################################################################
  externals:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: clang, arch: x86    , opts: "-mavx2 -mf16c" }
        - { comp: gcc  , arch: x86    , opts: "-msse2"        }
    steps:
      - name: Print Runner Info
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
          echo "Available disk space: $(df -h / | tail -1 | awk '{print $4 "/" $2}')"
      - name: Install KUMI
        run: |
          mkdir 3rdparty
          cd 3rdparty
          git clone https://github.com/jfalcou/kumi.git
          cd kumi 
          cmake -B build -G Ninja -DKUMI_BUILD_TEST=OFF
          cmake --install build --prefix /usr
      - name: Install RABERU
        run: |
          cd 3rdparty
          git clone https://github.com/jfalcou/raberu.git
          cd raberu
          cmake -B build -G Ninja -DRABERU_BUILD_TEST=OFF
          cmake --install build --prefix /usr
      - name: Install SPY 
        run: |
          cd 3rdparty
          git clone https://github.com/jfalcou/spy.git
          cd spy
          cmake -B build -G Ninja -DSPY_BUILD_TEST=OFF
          cmake --install build --prefix /usr
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Prepare EVE with ${{ matrix.cfg.comp }} @ ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run:  |
          mkdir build
          cd build
          cmake ..  -G Ninja -DEVE_TEST_LOT=native -DEVE_OPTIONS="${{ matrix.cfg.opts }} -DEVE_USE_EXTERNAL_DEPENDENCIES" \
                    -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake

      - name: "Chunk 1: Compile"
        run:  |
          cd build
          ninja unit.core.exe -j 4
      - name: "Chunk 1: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.core\."
      - name: "Chunk 1: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 2: Compile"
        run:  |
          cd build
          ninja unit.api.exe unit.math.exe -j 4
      - name: "Chunk 2: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.api\.|^unit\.math\."
      - name: "Chunk 2: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 3: Compile"
        run:  |
          cd build
          ninja unit.arch.exe unit.meta.exe unit.internals.exe unit.polynomial.exe unit.combinatorial.exe unit.bessel.exe unit.elliptic.exe unit.memory.exe unit.special.exe unit.algo.exe examples.exe -j 4
      - name: "Chunk 3: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.arch\.|^unit\.meta\.|^unit\.internals\.|^unit\.polynomial\.|^unit\.combinatorial\.|^unit\.bessel\.|^unit\.elliptic\.|^unit\.memory\.|^unit\.special\.|^unit\.algo\.|^examples\."

  ##################################################################################################
  ## Full emulation tests
  ##################################################################################################
  nosimd:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: clang , arch: x86     , opts: -DEVE_NO_SIMD         }
        - { comp: gcc   , arch: x86     , opts: -DEVE_NO_SIMD         }

    steps:
      - name: Print Runner Info
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
          echo "Available disk space: $(df -h / | tail -1 | awk '{print $4 "/" $2}')"
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Running CMake for ${{ matrix.cfg.comp }} on ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DEVE_TEST_LOT=native -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake
      - name: "Chunk 1: Compile"
        run:  |
          cd build
          ninja unit.core.exe -j 4
      - name: "Chunk 1: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.core\."
      - name: "Chunk 1: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 2: Compile"
        run:  |
          cd build
          ninja unit.api.exe unit.math.exe -j 4
      - name: "Chunk 2: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.api\.|^unit\.math\."
      - name: "Chunk 2: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 3: Compile"
        run:  |
          cd build
          ninja unit.arch.exe unit.meta.exe unit.internals.exe unit.polynomial.exe unit.combinatorial.exe unit.bessel.exe unit.elliptic.exe unit.memory.exe unit.special.exe unit.algo.exe examples.exe -j 4
      - name: "Chunk 3: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.arch\.|^unit\.meta\.|^unit\.internals\.|^unit\.polynomial\.|^unit\.combinatorial\.|^unit\.bessel\.|^unit\.elliptic\.|^unit\.memory\.|^unit\.special\.|^unit\.algo\.|^examples\."

  ##################################################################################################
  ## C++26 preemptive test
  ##################################################################################################
  preemptive:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: clang20, arch: x86    , opts: "-std=c++26"  }
        - { comp: gcc15  , arch: x86    , opts: "-std=c++26"  }
        - { comp: gcc    , arch: x86    , opts: "-std=c++26"  }
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Prepare EVE with ${{ matrix.cfg.comp }} @ ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run:  |
          mkdir build
          cd build
          cmake ..  -G Ninja -DEVE_TEST_LOT=native -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake
      - name: "Chunk 1: Compile"
        run:  |
          cd build
          ninja unit.core.exe -j 4
      - name: "Chunk 1: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.core\."
      - name: "Chunk 1: Cleanup"
        run:  |
          cd build
          ninja clean

      - name: "Chunk 2: Compile"
        run:  |
          cd build
          ninja unit.api.exe unit.math.exe -j 4
      - name: "Chunk 2: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.api\.|^unit\.math\."
      - name: "Chunk 2: Cleanup"
        run:  |
          cd build
          ninja clean
      - name: "Chunk 3: Compile"
        run:  |
          cd build
          ninja unit.arch.exe unit.meta.exe unit.internals.exe unit.polynomial.exe unit.combinatorial.exe unit.bessel.exe unit.elliptic.exe unit.memory.exe unit.special.exe unit.algo.exe examples.exe -j 4
      - name: "Chunk 3: Run"
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit\.arch\.|^unit\.meta\.|^unit\.internals\.|^unit\.polynomial\.|^unit\.combinatorial\.|^unit\.bessel\.|^unit\.elliptic\.|^unit\.memory\.|^unit\.special\.|^unit\.algo\.|^examples\."
