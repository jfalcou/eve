name: EVE - Unit Tests PowerPC and RISC-V
on:
  pull_request:
    branches:
      - main

concurrency:
  group: unit-ppc-riscv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## PPC Tests, under qemu
  ##################################################################################################
  other-arch:
    name: other-arch (${{ matrix.cfg.comp }}, ${{ matrix.cfg.arch }}, ${{ matrix.chunk.name }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        ## A hosted runner per chunk, eight per target: under qemu a chunk of a whole module runs over an hour.
        ## unit.algo.algorithm is built for every qemu target but runs on the native targets only: the algorithms have no code per architecture.
        include:
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: core-a, targets: "unit.core.exe", tests: "^unit\\.core\\.[a-i]" } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: core-b, targets: "unit.core.exe", tests: "^unit\\.core\\.[j-z]" } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: api-compress, targets: "unit.api.compress.exe", tests: "^unit\\.api\\.compress\\." } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: api-rest, targets: "unit.api.regular.exe unit.api.translation.exe unit.api.tuple.exe unit.api.udt.exe", tests: "^unit\\.api\\.regular\\.|^unit\\.api\\.translation\\.|^unit\\.api\\.tuple\\.|^unit\\.api\\.udt\\." } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: math  , targets: "unit.math.exe", tests: "^unit\\.math\\." } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: rest-a, targets: "unit.arch.exe unit.meta.exe unit.internals.exe unit.polynomial.exe unit.combinatorial.exe", tests: "^unit\\.arch\\.|^unit\\.meta\\.|^unit\\.internals\\.|^unit\\.polynomial\\.|^unit\\.combinatorial\\." } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: rest-b, targets: "unit.bessel.exe unit.elliptic.exe unit.memory.exe unit.special.exe", tests: "^unit\\.bessel\\.|^unit\\.elliptic\\.|^unit\\.memory\\.|^unit\\.special\\." } }
        - { cfg: { comp: gcc, arch: ppc64, opts: -Wno-psabi }, chunk: { name: rest-c, targets: "unit.algo.exe examples.exe", tests: "^unit\\.algo\\.[b-z]|^unit\\.algo\\.array|^examples\\." } }
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Prepare EVE with ${{ matrix.cfg.comp }} @ ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run:  |
          mkdir build
          cd build
          cmake ..  -G Ninja -DEVE_TEST_LOT=family -DEVE_OPTIONS="${{ matrix.cfg.opts }}" \
                    -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake
      - name: Compile ${{ matrix.chunk.name }}
        run:  |
          cd build
          ninja ${{ matrix.chunk.targets }} -j 4
      - name: Run ${{ matrix.chunk.name }}
        run:  |
          cd build
          ctest --output-on-failure -j 4 --timeout 3600 -R "${{ matrix.chunk.tests }}"

  ##################################################################################################
  ## RISC-V Targets
  ##################################################################################################
  riscv:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: clang , arch: riscv, runner: "run_rvv128",       opts: "-mrvv-vector-bits=128 -march=rv64gcv -O3" }
        - { comp: clang , arch: riscv, runner: "run_rvv128_fhmin", opts: "-mrvv-vector-bits=128 -march=rv64gcv_zfhmin_zvfhmin -O3" }
        - { comp: clang , arch: riscv, runner: "run_rvv256",       opts: "-mrvv-vector-bits=256 -march=rv64gcv_zfh_zvfh -O3" }
    steps:
      - name: Print Runner Info
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
          echo "Available disk space: $(df -h / | tail -1 | awk '{print $4 "/" $2}')"
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Running CMake for ${{ matrix.cfg.comp }} on ${{ matrix.cfg.arch }} with ${{ matrix.cfg.opts }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DEVE_TEST_LOT=family -DEVE_RUNNER_SCRIPT=${{ matrix.cfg.runner }} -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/${{ matrix.cfg.comp }}.${{ matrix.cfg.arch }}.cmake
      - name: Compiling Unit Tests
        run: |
          cd build
          ninja unit.meta.exe unit.arch.exe unit.core.bit_cast.exe unit.api.regular.wide.exe unit.core.simd_cast.exe unit.core.count_true.exe unit.memory.store.exe unit.memory.store_equivalent.exe -j 4
          ctest --output-on-failure -j 4 --timeout 3600 -R "^unit.meta.*.exe|^unit.arch.*.exe|unit.core.bit_cast.exe|unit.api.regular.wide.exe|unit.core.simd_cast.exe|unit.core.count_true.exe|unit.memory.store.*"
          ninja clean
      - name: Compiling Big Unit Tests
        run: |
          cd build
          ninja unit.api.compress.exe -j 2
          ctest --output-on-failure -R "^unit.api.compress.*"
          ninja clean
