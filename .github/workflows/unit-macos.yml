name: EVE - Unit Tests macOS
on:
  pull_request:
    branches:
      - main

concurrency:
  group: unit-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## The native cardinal alone, compiled first: every other job of this file waits for it.
  ##################################################################################################
  native-macos:
    runs-on: [macos-15]
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: 'clang', opts: "-Wno-psabi -march=armv8.7-a+fp16" }
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Running CMake for ${{ matrix.cfg.comp }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DEVE_TEST_LOT=native -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DCMAKE_TOOLCHAIN_FILE="../cmake/toolchain/${{ matrix.cfg.comp }}.osx.cmake"
      - name: Compiling Unit Tests
        run:  cd build && ninja unit.exe -j 2
      - name: Running Unit Tests
        run: cd build && ctest --output-on-failure -j 2 --timeout 3600 -E ^doc.*.exe

  ##################################################################################################
  ## Mac OS X Targets
  ##################################################################################################
  macosx:
    needs: native-macos
    runs-on: [macos-15]
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { comp: 'clang', opts: "-Wno-psabi -march=armv8.7-a+fp16" }
    steps:
      - name: Print Runner Info
        run: |
          system_profiler SPHardwareDataType | grep -E "(Memory|Cores)"
          df -h /System/Volumes/Data
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Running CMake for ${{ matrix.cfg.comp }}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DEVE_TEST_LOT=extra -DEVE_OPTIONS="${{ matrix.cfg.opts }}" -DCMAKE_TOOLCHAIN_FILE="../cmake/toolchain/${{ matrix.cfg.comp }}.osx.cmake"
      - name: Compiling Unit Tests
        run:  cd build && ninja unit.exe -j 2
      - name: Running Unit Tests
        run: cd build && ctest --output-on-failure -j 2 --timeout 3600 -E ^doc.*.exe
