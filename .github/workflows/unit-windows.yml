name: EVE - Unit Tests Windows
on:
  pull_request:
    branches:
      - main

concurrency:
  group: unit-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## The family lot in one job on the self-hosted Windows machine, 8 cores and 64 GB.
  ##################################################################################################
  windows:
    name: windows (${{ matrix.cfg.name }})
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - {name: "MSVC"   , mode: Debug   , options: "-DEVE_NO_FORCEINLINE"}
        # - {name: "ClangCL", mode: Debug   , options: "-DEVE_NO_FORCEINLINE", toolchain: "-T ClangCL -DEVE_USE_PCH=OFF"}

    steps:
      - name: Enter Git Bash
        shell: cmd
        run: echo C:\Program Files\Git\bin>> %GITHUB_PATH%
      - name: Fetch current branch
        uses: actions/checkout@v6
      ## Ninja needs the MSVC environment already loaded, where the Visual Studio generator found it
      ## on its own.
      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      ## The Debug flags without /Zi, so CMake copies no compile PDB to every test reusing the
      ## precompiled header. Keep the dashes: Git Bash rewrites a value starting with / as a path.
      - name: Running CMake for ${{ matrix.cfg.name }} with ${{ matrix.cfg.options }}
        run: |
          cmake -G Ninja -DEVE_TEST_LOT=family -DEVE_HEAVY_POOL=3 -B build -DCMAKE_BUILD_TYPE=${{ matrix.cfg.mode }} ${{ matrix.cfg.toolchain }} -DCMAKE_CXX_FLAGS="${{ matrix.cfg.options }}" -DCMAKE_CXX_FLAGS_DEBUG="-Ob0 -Od -RTC1"
      - name: Compiling Unit Tests
        run: cmake --build build --target unit.exe --parallel 8
      - name: Running Unit Tests
        run: |
          cd build
          ctest --output-on-failure --parallel 8 -E ^doc.*.exe

  ##################################################################################################
  ## The documentation examples. Keep them in this workflow behind needs: windows, since asgard is
  ## the only Windows runner and GitHub gives it to the jobs of separate workflows in arrival order.
  ##################################################################################################
  doc-windows:
    needs: windows
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: bash
    steps:
      - name: Enter Git Bash
        shell: cmd
        run: echo C:\Program Files\Git\bin>> %GITHUB_PATH%
      - name: Fetch current branch
        uses: actions/checkout@v6
      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare EVE with MSVC
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-DEVE_NO_FORCEINLINE" -DCMAKE_CXX_FLAGS_DEBUG="-Ob0 -Od -RTC1"
      - name: Compile Documentation Tests
        run: cmake --build build --target doc.exe --parallel 8
      - name: Run Documentation Tests
        run: |
          cd build
          ctest --output-on-failure --parallel 8 -R ^doc.*.exe
