## Static analysis of include/eve by SonarQube Cloud, through the unit tests' compilation database.
##
## EVE is header-only, so the headers are only analyzed as seen from the translation units that
## include them: the unit tests. CMake writes compile_commands.json at configure time, and the test
## sources are generated by configure_file, so no compilation is needed before the scan.
name: EVE - Sonar
on:
  workflow_dispatch:
  ## A pull request runs it only when it changes the Sonar setup. Open it to every pull request once
  ## the duration of a scan is known: the Cloud caches the analysis per translation unit, so a scan
  ## that follows a full one on main only re-analyzes the units a change touches.
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sonar.yml
      - sonar-project.properties

concurrency:
  group: eve-sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud
    ## A fork has no SONAR_TOKEN: the scan would fail on its pull requests for nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    ## A hosted runner: the scan action fetches sonar-scanner into the runner and needs curl, unzip
    ## and node, which the compilers image does not carry.
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6
        with:
          ## Sonar reads the history to tell new code from old: a shallow clone degrades the report.
          fetch-depth: 0

      - name: Install g++-14 and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build jq

      ## No PCH: the analyzer parses the headers itself and gains nothing from a .gch, which it
      ## would otherwise have to find on disk. Everything else matches the gcc/AVX2 unit job.
      - name: Configure EVE and write the compilation database
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/gcc.x86.cmake \
                -DEVE_OPTIONS="-mavx2 -mf16c" \
                -DEVE_TEST_LOT=native \
                -DEVE_USE_PCH=OFF \
                -DEVE_BUILD_DOCUMENTATION=OFF

      ## Keep the units under test/ and drop the PCH stubs: every unit is a full parse of EVE for
      ## the analyzer, so the fewer and the more representative, the better.
      - name: Select the translation units to analyze
        run: |
          jq '[ .[] | select(.file | test("/test/(unit|doc)/")) ]' build/compile_commands.json \
             > build/sonar_compile_commands.json
          echo "$(jq length build/sonar_compile_commands.json) translation units selected"

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=build/sonar_compile_commands.json
            --define sonar.cfamily.threads=4