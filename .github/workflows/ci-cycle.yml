## Once every unit workflow of a commit is complete, one comment on the pull request gives the
## wall time of the cycle and of each rerun, with their charts, SVGs kept on the branch ci-cycle.
name: EVE - CI Cycle
on:
  workflow_run:
    workflows:
      - EVE - Unit Tests x86
      - EVE - Unit Tests ARM
      - EVE - Unit Tests PowerPC and RISC-V
      - EVE - Unit Tests Build Modes
      - EVE - Unit Tests AVX512
      - EVE - Unit Tests macOS
      - EVE - Unit Tests Windows
    types: [completed]
  ## gh workflow run "EVE - CI Cycle" -f sha=<sha> -f pr=<number> reports a cycle again.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose cycle to report
        required: true
      pr:
        description: Pull request to comment, empty for none
        required: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
  PR: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr }}

## Each unit workflow that ends starts this one: only the last report of a commit matters.
concurrency:
  group: ci-cycle-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  cycle:
    ## A cancelled run leaves its cycle without a report, and a skipped job waits for no runner.
    if: github.event.workflow_run.conclusion != 'cancelled'
    ## On a hosted runner, the report waits for the pool the unit workflows fill, for hours.
    runs-on: [self-hosted, avx512]
    ## Do not drop -u root: the image has no gh, which the action fetches into /usr/local.
    container:
      image: ghcr.io/jfalcou/compilers:v10
      options: -u root
    steps:
      - uses: jfalcou/copacabana/.github/actions/ci-cycle@95054d7b00a79414ec717fdf0b770f7c9338b789
        with:
          sha: ${{ env.SHA }}
          pr: ${{ env.PR }}
